name: Build, Scan & Deploy

on:
    push:
        branches: [main]

env:
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            sha_tag: ${{ steps.vars.outputs.sha_tag }}
        steps:
            - uses: actions/checkout@v4

            - name: Set image tag
              id: vars
              run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Build frontend image
              run: |
                  docker build --build-arg NEXT_PUBLIC_API_URL="https://api.coliving.nabilbuilds.my.id" -t ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_tag }} ./client
                  docker tag ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_tag }} ${{ env.IMAGE_PREFIX }}-frontend:latest

            - name: Build backend image
              run: |
                  docker build -t ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_tag }} ./server-go
                  docker tag ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_tag }} ${{ env.IMAGE_PREFIX }}-backend:latest

            # Run Trivy vulnerability scanner on both images
            - name: Run Trivy vulnerability scanner (Frontend)
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_tag }}"
                  format: "table"
                  exit-code: "0" 
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

            - name: Run Trivy vulnerability scanner (Backend)
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_tag }}"
                  format: "table"
                  exit-code: "0" 
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push frontend
              run: |
                  docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_tag }}
                  docker push ${{ env.IMAGE_PREFIX }}-frontend:latest

            - name: Push backend
              run: |
                  docker push ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_tag }}
                  docker push ${{ env.IMAGE_PREFIX }}-backend:latest

    deploy:
        needs: build-and-push
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            
            - name: Apply Infrastructure Manifests (Postgres)
              run: |
                  kubectl apply -f k8s/postgres.yaml

            - name: Deploy App
              run: |
                  # Replace placeholder images with the newly built tags
                  sed -i "s|ghcr.io/USERNAME_GITHUB/REPO-frontend:latest|${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build-and-push.outputs.sha_tag }}|g" k8s/frontend.yaml
                  sed -i "s|ghcr.io/USERNAME_GITHUB/REPO-backend:latest|${{ env.IMAGE_PREFIX }}-backend:${{ needs.build-and-push.outputs.sha_tag }}|g" k8s/backend.yaml

                  # Apply the manifests
                  kubectl apply -f k8s/backend.yaml
                  kubectl apply -f k8s/frontend.yaml

                  # Wait for rollout to complete
                  kubectl rollout status deployment/kost-backend --timeout=120s
                  kubectl rollout status deployment/kost-frontend --timeout=120s
