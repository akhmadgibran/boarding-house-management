version: "2"
sql:
  - engine: "postgresql"
    queries: [
      "db/queries/auth.sql", "db/queries/users.sql"]
    schema: "db/migrations"
    gen:
      go:
        package: "repository"
        out: "internal/auth/repository"
        emit_json_tags: true
        emit_interface: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
